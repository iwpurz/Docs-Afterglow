<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Docs Afterglow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" width="26" height="26" alt="">
    <h1>Docs Afterglow</h1>
    <label class="switch" title="Turn the theme on or off (Alt+Shift+D)">
      <input type="checkbox" id="enabled" aria-label="Enable theme">
      <span aria-hidden="true"></span>
    </label>
  </header>

  <section>
    <h2 id="themeHeading">Theme</h2>
    <input id="themeSearch" class="theme-search" type="search" placeholder="Search themes" aria-label="Search themes">
    <div id="grid" class="grid" role="group" aria-labelledby="themeHeading"></div>
  </section>

  <section>
    <h2 id="bgHeading">Background</h2>
    <select id="bgType" aria-labelledby="bgHeading"></select>
    <div class="row" id="speedRow">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="100">
    </div>
  </section>

  <section>
    <h2 id="vibeHeading">While you type</h2>
    <div class="chips" role="group" aria-labelledby="vibeHeading">
      <button type="button" class="chip" id="chipFx" aria-pressed="false">Effects</button>
      <button type="button" class="chip" id="chipSound" aria-pressed="false">Sounds</button>
      <button type="button" class="chip" id="chipMusic" aria-pressed="false">Music</button>
    </div>
    <div class="row" id="musicRow" hidden>
      <label for="musicLink">Music link</label>
      <input type="url" id="musicLink" placeholder="YouTube, Spotify, SoundCloud or .mp3 link" maxlength="500" autocomplete="off" spellcheck="false">
    </div>
    <p class="hint" id="musicNote" role="status"></p>
  </section>

  <div class="news" id="news" hidden>
    <strong>New in 1.2</strong> Better typing sounds, your own music (YouTube, Spotify or audio files), new Studio effects, gentler film grain. Typing features are off until you turn them on.
    <button type="button" id="newsClose">Got it</button>
  </div>

  <div class="btns">
    <button id="open" type="button">All settings</button>
    <button id="studio" type="button">Studio</button>
  </div>

  <p class="foot"><button type="button" id="diag" class="link">Copy diagnostics</button><span id="diagMsg" role="status"></span></p>

  <script src="../shared.js"></script>
  <script src="../layers.js"></script>
  <script src="../themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
